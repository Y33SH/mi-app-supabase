<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClimaPro | Registro</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Regístrate para solicitar nuestros servicios
            </p>

            <form id="registroForm">

                <div class="campo">

                    <label>Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        required
                    >

                </div>

                <div class="campo">

                    <label>Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        minlength="6"
                        required
                    >

                </div>

                <button type="submit">
                    Registrarse
                </button>

            </form>

            <p id="mensaje"></p>

            <p>
                ¿Ya tienes cuenta?

                <a href="index.html">
                    Iniciar sesión
                </a>
            </p>

        </section>

    </main>

    <script type="module" src="js/registro.js"></script>

</body>

</html>
