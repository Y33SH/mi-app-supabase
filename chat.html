<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climas Torres | Chat</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">

        <div>
            <div class="sidebar-logo">
                <span>❄</span>
                <h2>Climas Torres</h2>
            </div>

            <nav class="menu">
                <a href="dashboard.html">⌂ Inicio</a>
                <a href="servicios.html">🔧 Solicitar servicio</a>
                <a href="servicios.html#mis-servicios">📋 Mis servicios</a>
                <a href="chat.html" class="activo">💬 Chat</a>
            </nav>
        </div>

        <button id="cerrarSesion" class="cerrar-sesion">
            Cerrar sesión
        </button>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>
                <p class="dashboard-pequeno">Soporte</p>
                <h1>Chat con Climas Torres</h1>
                <p>Cuéntanos en qué podemos ayudarte.</p>
            </div>

        </header>


        <section class="chat-card">

            <div class="chat-header">

                <div class="chat-avatar">
                    ❄
                </div>

                <div>
                    <h3>Soporte Climas Torres</h3>

                    <p>
                        <span class="punto-online"></span>
                        Disponible
                    </p>
                </div>

            </div>


            <div id="chatMensajes" class="chat-mensajes">

                <div class="mensaje mensaje-soporte">

                    <div class="burbuja">
                        <strong>Climas Torres</strong>

                        <p>
                            Hola 👋 ¿En qué podemos ayudarte hoy?
                        </p>
                    </div>

                </div>

            </div>


            <form id="chatForm" class="chat-form">

                <input
                    type="text"
                    id="mensajeInput"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Enviar ➤
                </button>

            </form>

        </section>

    </main>


    <script type="module" src="js/chat.js"></script>

</body>
</html>
