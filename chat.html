<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climas Torres | Chat</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/brand.css">
</head>

<body class="dashboard-body client-dashboard">

    <aside class="sidebar client-sidebar">

        <div>
            <div class="sidebar-logo">
                <img
                    class="brand-logo brand-logo-sidebar"
                    src="assets/climas-torres-logo.png"
                    alt="Climas Torres"
                >
                <div class="sidebar-brand-caption">
                    <small>CLIMATIZACIÓN Y SERVICIO</small>
                </div>
            </div>

            <p class="client-nav-caption">MI ESPACIO</p>
            <nav class="menu client-menu" aria-label="Navegación principal">
                <a href="dashboard.html">
                    <span aria-hidden="true">⌂</span> Inicio
                </a>
                <a href="servicios.html">
                    <span aria-hidden="true">＋</span> Solicitar servicio
                </a>
                <a href="servicios.html#mis-servicios">
                    <span aria-hidden="true">▤</span> Mis servicios
                </a>
                <a href="dashboard.html#pagos">
                    <span aria-hidden="true">$</span> Mis pagos
                </a>
                <a href="chat.html" class="activo" aria-current="page">
                    <span aria-hidden="true">▢</span> Chat de ayuda
                </a>
                <a href="dashboard.html#perfil">
                    <span aria-hidden="true">◉</span> Mi perfil
                </a>
            </nav>
        </div>

        <button id="cerrarSesion" class="cerrar-sesion">
            Cerrar sesión
        </button>

    </aside>


    <main class="dashboard-main client-main">

        <header class="dashboard-header client-header">

            <div>
                <p class="dashboard-pequeno">TU ESPACIO CLIMAS TORRES</p>
                <h1>Chat con Climas Torres</h1>
                <p>Cuéntanos en qué podemos ayudarte.</p>
            </div>

        </header>


        <section class="chat-card client-chat-card" aria-label="Chat de soporte">

            <div class="chat-header">

                <div class="chat-avatar chat-avatar-brand">
                    <img
                        class="brand-logo"
                        src="assets/climas-torres-logo.png"
                        alt="Climas Torres"
                    >
                </div>

                <div>
                    <h3>Soporte Climas Torres</h3>

                    <p>
                        <span class="punto-online"></span>
                        Disponible
                    </p>
                </div>

            </div>


            <div id="chatMensajes" class="chat-mensajes" role="log" aria-live="polite" aria-label="Mensajes del chat">

                <div class="mensaje mensaje-soporte">

                    <div class="burbuja">
                        <strong>Climas Torres</strong>

                        <p>
                            Hola 👋 ¿En qué podemos ayudarte hoy?
                        </p>
                    </div>

                </div>

            </div>


            <form id="chatForm" class="chat-form">

                <input
                    type="text"
                    id="mensajeInput"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Enviar ➤
                </button>

            </form>

        </section>

    </main>


    <script type="module" src="js/chat.js"></script>

</body>
</html>
